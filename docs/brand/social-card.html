<!doctype html>
<!-- The website's social preview (og:image), 1200x630. Render it to website/assets/social-card.png with:
     msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=website/assets/social-card.png docs/brand/social-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Pacifico&family=Geist:wght@400..600&family=Geist+Mono:wght@500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: radial-gradient(120% 90% at 30% 0%, #4a1d0c, #22110a 50%, #140a05); color: #fff5e1; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: .55; filter: blur(30px); }
  .b1 { width: 620px; height: 620px; left: -160px; top: 160px; background: radial-gradient(circle, #e63b2e, transparent 65%); }
  .b2 { width: 560px; height: 560px; right: -120px; top: -80px; background: radial-gradient(circle, #14988c, transparent 65%); }
  .b3 { width: 460px; height: 460px; left: 520px; top: 320px; background: radial-gradient(circle, #ff9f1c, transparent 65%); opacity: .35; }

  /* papel picado */
  .bunting { position: absolute; left: 0; right: 0; top: 0; height: 90px; display: flex; justify-content: space-around; padding: 0 10px; }
  .flag { width: 46px; height: 58px; margin-top: calc(var(--y) * 1px); transform: rotate(calc(var(--r) * 1deg)); transform-origin: 50% 0; background: var(--c); opacity: .92;
    clip-path: polygon(0 0, 100% 0, 100% 80%, 87.5% 100%, 75% 80%, 62.5% 100%, 50% 80%, 37.5% 100%, 25% 80%, 12.5% 100%, 0 80%);
    -webkit-mask: radial-gradient(circle at 50% 44%, transparent 7px, #000 7.5px); mask: radial-gradient(circle at 50% 44%, transparent 7px, #000 7.5px); }

  .logo { position: absolute; left: 70px; top: 130px; width: 400px; height: 400px; filter: drop-shadow(0 24px 50px rgba(255, 159, 28, .45)); transform: rotate(-6deg); }
  .copy { position: absolute; left: 500px; right: 50px; top: 150px; }
  h1 { margin: 0; font: 400 104px/.95 "Lilita One", system-ui, sans-serif; text-shadow: 0 7px 0 rgba(0, 0, 0, .3); }
  h1 em { font-style: normal; text-shadow: none; filter: drop-shadow(0 7px 0 rgba(0, 0, 0, .3)); background: linear-gradient(100deg, #ffd23f, #ff9f1c 45%, #ff5a4e); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
  .slogan { margin: 22px 0 0; font: 400 44px/1.25 "Pacifico", cursive; }
  .slogan b { font-weight: 400; color: #ffc93c; }
  .brand { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; font: 600 26px/1 "Geist", sans-serif; }
  .brand span { font: 500 15px/1 "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #d9bf9f; margin-left: 8px; }

  .drip { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #ffc93c; }
  .drip::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 34px; background: radial-gradient(18px 22px at 50% 100%, #ffc93c 98%, transparent) 0 0 / 52px 34px repeat-x; }
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <div class="bunting">
    <span class="flag" style="--c:#ff5a4e;--y:0;--r:-5"></span><span class="flag" style="--c:#ffc93c;--y:8;--r:4"></span><span class="flag" style="--c:#8ac926;--y:14;--r:-3"></span>
    <span class="flag" style="--c:#2ec4b6;--y:19;--r:6"></span><span class="flag" style="--c:#ff7eb6;--y:22;--r:-4"></span><span class="flag" style="--c:#ff9f1c;--y:24;--r:3"></span>
    <span class="flag" style="--c:#ff5a4e;--y:24;--r:-6"></span><span class="flag" style="--c:#ffc93c;--y:22;--r:5"></span><span class="flag" style="--c:#8ac926;--y:19;--r:-3"></span>
    <span class="flag" style="--c:#2ec4b6;--y:14;--r:4"></span><span class="flag" style="--c:#ff7eb6;--y:8;--r:-5"></span><span class="flag" style="--c:#ff9f1c;--y:0;--r:3"></span>
  </div>

  <img class="logo" src="../../website/assets/icon.svg" alt="">

  <div class="copy">
    <h1>Notcho Notcho <em>Man!</em></h1>
    <p class="slogan">We got all the <b>“fixins”</b>.</p>
    <div class="brand">Shiny Notch <span>Free · macOS 14+</span></div>
  </div>
  <div class="drip"></div>
</body>
</html>
