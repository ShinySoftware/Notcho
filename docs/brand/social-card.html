<!doctype html>
<!-- The website's social preview (og:image), 1200x630. Render it to website/assets/social-card.png with (macOS):
     "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --headless --hide-scrollbars --force-device-scale-factor=1 \
       --virtual-time-budget=8000 --window-size=1200,630 --screenshot=website/assets/social-card.png docs/brand/social-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Pacifico&family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: radial-gradient(120% 90% at 30% 0%, #4a1d0c, #22110a 50%, #140a05); color: #fff5e1; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: .55; filter: blur(30px); }
  .b1 { width: 620px; height: 620px; left: -200px; top: 200px; background: radial-gradient(circle, #e63b2e, transparent 65%); }
  .b2 { width: 640px; height: 640px; right: -60px; top: -40px; background: radial-gradient(circle, #14988c, transparent 65%); }
  .b3 { width: 460px; height: 460px; left: 420px; top: 330px; background: radial-gradient(circle, #ff9f1c, transparent 65%); opacity: .35; }

  /* A macOS menu bar, so the panel reads as growing out of the notch. */
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 32px; background: rgba(20, 10, 5, .55); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font: 600 15px/1 "Geist", sans-serif; color: rgba(255, 245, 225, .78); }
  .menubar .l { display: flex; gap: 22px; }
  .menubar .l b { font-weight: 700; color: #fff5e1; }
  .menubar .r { display: flex; gap: 18px; font-weight: 500; }

  /* The open notch: flush with the top edge, curving out into the menu bar like the real one. */
  .notch { position: absolute; top: 0; left: 592px; width: 510px; padding: 34px 12px 12px; background: #000; border-radius: 0 0 38px 38px;
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .55)) drop-shadow(0 0 70px rgba(255, 159, 28, .28)); }
  .notch::before, .notch::after { content: ""; position: absolute; top: 0; width: 18px; height: 18px; }
  .notch::before { right: 100%; background: radial-gradient(circle at 0 100%, transparent 17.5px, #000 18px); }
  .notch::after { left: 100%; background: radial-gradient(circle at 100% 100%, transparent 17.5px, #000 18px); }
  .cam { position: absolute; top: 12px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2b3550, #0b0d14 70%); box-shadow: 0 0 0 2px #0a0a0a; }
  .notch img { display: block; width: 100%; border-radius: 26px; }

  .copy { position: absolute; left: 64px; top: 78px; width: 520px; }
  .eyebrow { display: flex; align-items: center; gap: 18px; }
  .eyebrow img { width: 92px; height: 92px; transform: rotate(-6deg); filter: drop-shadow(0 12px 26px rgba(255, 159, 28, .45)); }
  .eyebrow span { font: 600 15px/1.5 "Geist Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #d9bf9f; }
  h1 { margin: 6px 0 0; font: 400 132px/.95 "Lilita One", system-ui, sans-serif; letter-spacing: .005em; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .3));
    background: linear-gradient(100deg, #fff5e1 30%, #ffd23f 62%, #ff9f1c 82%, #ff5a4e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin: 10px 0 0; font: 600 31px/1.2 "Geist", sans-serif; letter-spacing: -.01em; }
  .slogan { margin: 12px 0 0; font: 400 30px/1.3 "Pacifico", cursive; color: #ffe8c2; }
  .slogan b { font-weight: 400; color: #ffc93c; }
  .chips { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 9px; max-width: 520px; }
  .chip { font: 600 15px/1 "Geist", sans-serif; padding: 9px 14px; border-radius: 999px; color: #1a0d06; background: var(--c); }
  .chip.more { background: transparent; color: #ffe8c2; box-shadow: inset 0 0 0 2px rgba(255, 232, 194, .45); }

  .drip { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #ffc93c; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; }
  .drip::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 30px; background: radial-gradient(18px 20px at 50% 100%, #ffc93c 98%, transparent) 0 0 / 52px 30px repeat-x; }
  .drip span { position: relative; font: 600 19px/1 "Geist Mono", monospace; color: #3a1a08; }
  .drip span.by { font: 600 16px/1 "Geist", sans-serif; letter-spacing: .02em; }
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

  <div class="menubar">
    <div class="l"><span>&#63743;</span><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span></div>
    <div class="r"><span>9:41</span></div>
  </div>

  <div class="notch">
    <span class="cam"></span>
    <img src="../screenshots/weather.png" alt="">
  </div>

  <div class="copy">
    <div class="eyebrow">
      <img src="../../website/assets/icon.svg" alt="">
      <span>Free · macOS · Windows · Linux</span>
    </div>
    <h1>Notcho</h1>
    <p class="tag">Your MacBook notch, piled high.</p>
    <p class="slogan">Notcho Notcho Man!<br>We got all the <b>“fixins”</b>.</p>
    <div class="chips">
      <span class="chip" style="--c:#ff5a4e">Now Playing</span>
      <span class="chip" style="--c:#2ec4b6">Weather</span>
      <span class="chip" style="--c:#ffc93c">File Tray</span>
      <span class="chip" style="--c:#ff7eb6">Timer</span>
      <span class="chip more">+ 11 more</span>
    </div>
  </div>

  <div class="drip"><span>shinysoftware.github.io/Notcho</span><span class="by">by ShinySoft · built with .NET MAUI</span></div>
</body>
</html>
