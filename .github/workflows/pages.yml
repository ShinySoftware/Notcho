name: Website

# Publishes the product website in website/ to GitHub Pages whenever it changes on main. The site is static HTML,
# CSS and JS with no build step, so the folder is uploaded as it is.
on:
  push:
    branches: [ main ]
    paths: [ 'website/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but never cancels one that's already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as GitHub's own Pages starter has them: since the repository was renamed, a freshly uploaded artifact
# takes GitHub's API a few seconds to list, and a deploy straight after the upload in the same job found nothing.
# The job boundary gives it that time, and a failed deploy can be re-run on its own without a second upload.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
